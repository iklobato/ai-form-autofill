<!doctype html>
<html><head><meta charset="utf-8"><title>Embedded form</title><link rel="stylesheet" href="style.css"></head>
<body>
<h2>Contact details</h2>
<form>
  <label for="em">Email</label><input id="em" type="email" name="email" autocomplete="email">
  <label for="ph">Phone</label><input id="ph" type="tel" name="phone" autocomplete="tel">
  <label for="city">City</label><input id="city" name="city" autocomplete="address-level2">
</form>
</body></html>
