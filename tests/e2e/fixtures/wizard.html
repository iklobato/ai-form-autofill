<!doctype html>
<html><head><meta charset="utf-8"><title>Signup wizard</title><link rel="stylesheet" href="style.css"></head>
<body>
<h1>Create your account</h1>
<form id="wiz" onsubmit="return false">
  <div id="step1">
    <label for="fn">First name</label><input id="fn" name="first_name" autocomplete="given-name">
    <label for="ln">Last name</label><input id="ln" name="last_name" autocomplete="family-name">
    <button type="button" id="next">Next</button>
  </div>
</form>
<script>
document.getElementById("next").addEventListener("click", () => {
  const s = document.createElement("div");
  s.id = "step2";
  s.innerHTML = '<h2>Step 2</h2><label for="city">City</label><input id="city" name="city" autocomplete="address-level2">' +
    '<label for="zip">Postal code</label><input id="zip" name="zip" autocomplete="postal-code">';
  document.getElementById("wiz").appendChild(s);
});
</script>
</body></html>
