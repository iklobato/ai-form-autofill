<!doctype html>
<html><head><meta charset="utf-8"><title>Checkout</title><link rel="stylesheet" href="style.css"></head>
<body>
<h1>Checkout</h1>
<form>
  <label for="em">Email</label><input id="em" type="email" autocomplete="email" value="pat@example.org">
  <label for="city">City</label><input id="city" autocomplete="address-level2" value="Lisbon">
  <label for="pw">Password</label><input id="pw" type="password" value="hunter22">
  <label for="cc">Card number</label><input id="cc" autocomplete="cc-number" value="4111111111111111">
  <label for="empty">Notes</label><input id="empty" name="notes">
</form>
</body></html>
