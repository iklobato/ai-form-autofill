<!doctype html>
<html><head><meta charset="utf-8"><title>Contact us</title><link rel="stylesheet" href="style.css"></head>
<body>
<h1>Contact us</h1>
<form>
  <label for="em">Email</label><input id="em" type="email" name="email" autocomplete="email">
  <label for="org">Company</label><input id="org" name="company">
  <label for="mi">Middle initial</label><input id="mi" name="middle_initial" maxlength="1">
  <label for="pw">Password</label><input id="pw" type="password" name="password">
  <label for="ssn">Social security number</label><input id="ssn" name="ssn">
  <label for="bio">About you</label><textarea id="bio" name="bio"></textarea>
</form>
</body></html>
