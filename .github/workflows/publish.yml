name: Publish to Chrome Web Store

# Publishes on every merge/push to main. The version is derived automatically
# as <major>.<minor>.<run_number> so each run is unique (the store rejects
# duplicate versions) — bump the major/minor in manifest.json when you want.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cws-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify (syntax + field-format tests)
        run: |
          # Syntax-check every shippable .js file (list shared with package.sh).
          grep -vE '^[[:space:]]*(#|$)' files.txt | grep -E '\.js$' | while read -r f; do
            node --check "$f"
          done
          node test-formats.js

      - name: Set version from run number
        env:
          RUN: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            m.version = m.version.split(".").slice(0, 2).join(".") + "." + process.env.RUN;
            fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2) + "\n");
            console.log("Publishing version " + m.version);
          '

      - name: Package
        run: bash ./package.sh

      - name: Publish
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: bash ./publish.sh
